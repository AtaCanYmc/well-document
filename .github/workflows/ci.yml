name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-scripts:
    name: Validate Scripts & Tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Shell Script Syntax
        run: |
          for f in $(find . -name "*.sh" -not -path "*/.*"); do
            echo "Checking syntax: $f"
            sh -n "$f"
          done

      - name: Test Grounding & Anti-Slop Tooling
        run: |
          python3 scripts/verify-grounding.py
          python3 scripts/verify-anti-slop.py

  governance-gate:
    name: Reusable Governance Gate
    uses: ./.github/workflows/well-document-gate.yml
