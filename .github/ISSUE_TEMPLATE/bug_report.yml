name: Bug Report
description: Report a defect, template error, or broken instruction in well-document
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify the issue has not been reported before opening a new ticket.
        For security vulnerability reports, refer to [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: Provide a clear, technical description of the defect.
      placeholder: Describe the defect concisely.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run invocation '...'
        2. Inspect output '...'
        3. Observe error or unexpected behavior '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: State what the skill or script should have produced instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output or Logs
      description: Paste terminal output or error traces here.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, AI assistant (Antigravity, Cursor, Claude Code, Codex), and version.
      placeholder: macOS 15.0, Antigravity 2.0, Node 20.x
    validations:
      required: true
